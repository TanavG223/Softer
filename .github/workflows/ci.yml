name: PaceBack verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: Native macOS build and tests
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test native package
        run: make macos-test
      - name: Build native executable
        run: make macos-build
      - name: Verify static submission site
        run: make site-test PYTHON=python3
