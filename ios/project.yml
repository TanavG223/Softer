name: PaceBackiOS

options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true

packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2

targets:
  PaceBackiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PaceBackiOS
      - path: ../third_party/software_licenses
        buildPhase: resources
        includes:
          - onnxruntime-1.24.2-MIT.txt
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.paceback.research.ios
        PRODUCT_NAME: PaceBack
        PRODUCT_MODULE_NAME: PaceBackiOS
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: PaceBack
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSFaceIDUsageDescription: PaceBack uses device authentication to protect caregiver and guardian controls.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PaceBackiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PaceBackiOSTests
    dependencies:
      - target: PaceBackiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.paceback.research.ios.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PaceBack.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PaceBack"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PaceBackiOS:
    build:
      targets:
        PaceBackiOS: all
        PaceBackiOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: PaceBackiOSTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
