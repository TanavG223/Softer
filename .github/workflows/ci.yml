name: PaceBack verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: Native macOS build and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Test native package
        run: make macos-test
      - name: Build native executable
        run: make macos-build
      - name: Verify static submission site
        run: make site-test PYTHON=python3
